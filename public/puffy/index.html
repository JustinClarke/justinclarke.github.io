<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Puffy Lux A/B Test Analysis</title>
  
  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=IBM+Plex+Mono:ital,wght@0,400;0,500;0,600&display=swap" rel="stylesheet">
  
  <!-- Tailwind CSS & Typography -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.tailwindcss.com?plugins=typography"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: {
            sans: ['Inter', 'sans-serif'],
            mono: ['IBM Plex Mono', 'monospace'],
          },
          colors: {
            surface: {
              DEFAULT: '#050505',
              card: '#0c0c0c',
              elevated: '#111111'
            },
            brand: '#00c8b4',
            accent: '#6366f1',
            text: {
              primary: 'rgba(255, 255, 255, 0.92)',
              secondary: 'rgba(255, 255, 255, 0.7)',
              tertiary: 'rgba(255, 255, 255, 0.55)',
            },
            viz: {
              success: '#4ade80',
              error: '#f87171',
              warning: '#fbbf24',
              info: '#60a5fa'
            }
          },
          typography: (theme) => ({
            dark: {
              css: {
                color: theme('colors.text.secondary'),
                a: {
                  color: theme('colors.brand'),
                  '&:hover': { color: theme('colors.brand') },
                },
                h1: { color: theme('colors.text.primary') },
                h2: { color: theme('colors.text.primary') },
                h3: { color: theme('colors.text.primary') },
                h4: { color: theme('colors.text.primary') },
                strong: { color: theme('colors.text.primary') },
                code: { color: theme('colors.text.primary'), backgroundColor: 'rgba(255,255,255,0.1)', padding: '2px 4px', borderRadius: '4px', fontWeight: '400' },
                'code::before': { content: '""' },
                'code::after': { content: '""' },
                blockquote: { borderLeftColor: theme('colors.brand'), color: theme('colors.text.tertiary') },
                th: { color: theme('colors.text.primary') },
                hr: { borderColor: 'rgba(255,255,255,0.1)' },
                thead: { borderBottomColor: 'rgba(255,255,255,0.1)' },
                'tbody tr': { borderBottomColor: 'rgba(255,255,255,0.05)' },
              },
            },
          }),
        }
      }
    }
  </script>

  <!-- Libraries -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/themes/prism-tomorrow.min.css" rel="stylesheet" />
  <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/prism.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/components/prism-python.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/plugins/line-numbers/prism-line-numbers.min.js"></script>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/plugins/line-numbers/prism-line-numbers.min.css" rel="stylesheet" />
  <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/plugins/line-highlight/prism-line-highlight.min.js"></script>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/plugins/line-highlight/prism-line-highlight.min.css" rel="stylesheet" />

  <style>
    body {
      background-color: #050505 !important;
      color: rgba(255, 255, 255, 0.92);
      -webkit-font-smoothing: antialiased;
    }
    .glass-card {
      background: rgba(255, 255, 255, 0.03);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.08);
    }
    .grid-bg {
      background-image: radial-gradient(rgba(255, 255, 255, 0.05) 0.8px, transparent 0.8px);
      background-size: 24px 24px;
    }
    .tab-content { display: none; }
    .tab-content.active { display: block; animation: fadeIn 0.3s ease; }
    
    .tab-btn {
      color: rgba(255, 255, 255, 0.55);
      border-bottom: 2px solid transparent;
      transition: all 0.2s;
    }
    .tab-btn:hover {
      color: rgba(255, 255, 255, 0.92);
    }
    .tab-btn.active {
      color: #00c8b4;
      border-bottom: 2px solid #00c8b4;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(5px); }
      to { opacity: 1; transform: translateY(0); }
    }

    /* Code Highlighting */
    pre[class*="language-"] {
      background: transparent;
      margin: 0;
      padding: 1.5rem;
      border-radius: 0.5rem;
    }
    .code-container {
      background: #0c0c0c;
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 0.75rem;
      overflow: hidden;
    }
    
    .line-highlight {
      background: rgba(0, 200, 180, 0.15);
      border-left: 3px solid #00c8b4;
      display: block;
      width: 100%;
    }
    
    .line-dimmed {
      opacity: 0.3;
      transition: opacity 0.3s;
    }

    .code-nav-btn {
      transition: all 0.2s;
    }
    .code-nav-btn.active {
      background: rgba(0, 200, 180, 0.1);
      border-color: rgba(0, 200, 180, 0.3);
      color: #00c8b4;
    }
    html.auth-pending #auth-screen {
      display: none !important;
    }
  </style>
</head>
<body class="bg-surface grid-bg font-sans selection:bg-brand selection:text-surface text-text-primary min-h-screen">

  <script>
    // Prevent password prompt flash if a valid session exists
    (function() {
      try {
        const session = localStorage.getItem('puffy_session');
        if (session) {
          const { timestamp } = JSON.parse(session);
          if (Date.now() - timestamp < 1800000) {
            document.documentElement.classList.add('auth-pending');
          }
        }
      } catch (e) {}
    })();
  </script>

  <!-- Gateway Form Overlay (Initially Visible) -->
  <div id="auth-screen" class="flex flex-col items-center justify-center min-h-screen w-full">
    <div class="bg-white/5 backdrop-blur-md border border-white/10 p-8 rounded-2xl max-w-sm w-full text-center">
      <div class="w-12 h-12 rounded-full bg-brand/10 border border-brand/20 text-brand font-mono font-bold flex items-center justify-center mx-auto mb-4 text-xl">P</div>
      <h3 class="text-xl font-semibold text-text-primary mb-2">Puffy Lux A/B Test</h3>
      <p class="text-sm text-text-secondary mb-6">This case study is password-protected to respect data privacy.</p>
      
      <input type="password" id="pw" placeholder="Enter Password" class="w-full px-4 py-3 rounded-lg bg-black/50 border border-white/10 text-white placeholder-white/30 focus:outline-none focus:border-brand/50 transition-colors mb-4" onkeydown="if(event.key==='Enter') unlock()">
      
      <button onclick="unlock()" class="w-full bg-brand/10 text-brand font-medium py-3 rounded-lg border border-brand/20 hover:bg-brand/20 transition-colors flex justify-center items-center gap-2">
        <span id="btn-text">Unlock Report</span>
        <svg id="btn-spinner" class="w-4 h-4 animate-spin hidden" viewBox="0 0 24 24" fill="none"><circle cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4" stroke-opacity="0.25"></circle><path d="M12 2a10 10 0 0 1 10 10" stroke="currentColor" stroke-width="4" stroke-linecap="round"></path></svg>
      </button>
      
      <div id="error" class="hidden text-red-400 text-sm mt-4">Incorrect password. Please try again.</div>
    </div>
  </div>

    async function decryptData(passwordStr, payloadB64) {
      const binaryString = atob(payloadB64);
      const len = binaryString.length;
      const bytes = new Uint8Array(len);
      for (let i = 0; i < len; i++) {
        bytes[i] = binaryString.charCodeAt(i);
      }

      const salt = bytes.slice(0, 16);
      const iv = bytes.slice(16, 28);
      const ciphertext = bytes.slice(28);

      const encoder = new TextEncoder();
      const passwordKey = await crypto.subtle.importKey(
        "raw",
        encoder.encode(passwordStr),
        { name: "PBKDF2" },
        false,
        ["deriveKey"]
      );

      const aesKey = await crypto.subtle.deriveKey(
        {
          name: "PBKDF2",
          salt: salt,
          iterations: 100000,
          hash: "SHA-256"
        },
        passwordKey,
        { name: "AES-GCM", length: 256 },
        false,
        ["decrypt"]
      );

      const decrypted = await crypto.subtle.decrypt(
        {
          name: "AES-GCM",
          iv: iv
        },
        aesKey,
        ciphertext
      );
      return new TextDecoder().decode(decrypted);
    }

    async function unlock(storedPassword) {
      const isAuto = !!storedPassword;
      const pwInput = storedPassword || document.getElementById('pw').value.trim().toLowerCase();
      const errorDiv = document.getElementById('error');
      const btnText = document.getElementById('btn-text');
      const btnSpinner = document.getElementById('btn-spinner');
      
      if (!pwInput) return;

      errorDiv.classList.add('hidden');
      btnText.classList.add('hidden');
      btnSpinner.classList.remove('hidden');

      let decryptedText = null;

      // Try the password against both payloads. AES-GCM authentication
      // rejects a wrong key, so no plaintext password lives in this file.
      try {
        try {
          decryptedText = await decryptData(pwInput, payload1);
        } catch(e) {
          decryptedText = await decryptData(pwInput, payload2);
        }
      } catch (err) {
        // Failed decryption
      }

      if (decryptedText) {
        const data = JSON.parse(decryptedText);
        
        // Save session if successful and manually typed
        if (!isAuto) {
          localStorage.setItem('puffy_session', JSON.stringify({
            password: pwInput,
            timestamp: Date.now()
          }));
        }
        
        // Hide auth and show main-app
        document.getElementById('auth-screen').classList.add('hidden');
        document.documentElement.classList.remove('auth-pending');
        const mainApp = document.getElementById('main-app');
        mainApp.innerHTML = data.html;
        mainApp.classList.remove('hidden');

        // Inject content
        document.getElementById('case-study-render').innerHTML = marked.parse(data.caseStudyMd);
        document.getElementById('methodology-render').innerHTML = marked.parse(data.methodologyMd);
        document.getElementById('python-source').textContent = data.sourceCode;

        // Re-initialize code view
        highlightCode('all', document.querySelector('.code-nav-btn'));

        // Render charts
        initFunnelChart();
      } else {
        if (isAuto) {
          localStorage.removeItem('puffy_session');
          document.documentElement.classList.remove('auth-pending');
        }
        errorDiv.classList.remove('hidden');
      }

      btnText.classList.remove('hidden');
      btnSpinner.classList.add('hidden');
    }

    // Tabs Logic
    function switchTab(tabId) {
      document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
      document.querySelectorAll('.tab-btn').forEach(el => el.classList.remove('active'));
      
      document.getElementById(tabId).classList.add('active');
      document.getElementById('btn-' + tabId).classList.add('active');
    }

    // Code Highlight Logic
    const highlightRanges = {
      'all': [],
      'funnel': [[104, 121]],
      'deadtap': [[128, 137]],
      'ztest': [[33, 40], [165, 171]],
      'srm': [[172, 175], [226, 233]]
    };

    let sourceCodeStr = null; // Will be set to data.sourceCode on successful decrypt

    function highlightCode(key, btnEl) {
      if (!sourceCodeStr) {
        sourceCodeStr = document.getElementById('python-source').textContent;
      }

      document.querySelectorAll('.code-nav-btn').forEach(el => {
        el.classList.remove('active', 'bg-brand/10', 'border-brand/30');
        el.classList.add('bg-white/5', 'border-white/5');
      });
      btnEl.classList.remove('bg-white/5', 'border-white/5');
      btnEl.classList.add('active', 'bg-brand/10', 'border-brand/30');

      const ranges = highlightRanges[key];
      const preEl = document.querySelector('pre');
      const codeEl = document.getElementById('python-source');
      
      if (key === 'all') {
         codeEl.innerHTML = Prism.highlight(sourceCodeStr, Prism.languages.python, 'python');
         return;
      }
      
      let dataLineStr = ranges.map(r => r[0] + '-' + r[1]).join(',');
      preEl.setAttribute('data-line', dataLineStr);
      
      Prism.highlightElement(codeEl);
      
      if (ranges.length > 0) {
         const lineNum = ranges[0][0];
         const scrollY = (lineNum * 21) - 100;
         preEl.scrollTo({top: scrollY, behavior: 'smooth'});
      }
    }

          plugins: {
            legend: { position: 'top', align: 'end', labels: { usePointStyle: true, boxWidth: 8, padding: 20 } },
            tooltip: { mode: 'index', intersect: false, backgroundColor: '#111111', titleColor: '#ffffff', bodyColor: 'rgba(255,255,255,0.7)', borderColor: 'rgba(255,255,255,0.1)', borderWidth: 1, padding: 12, callbacks: { label: function(context) { return context.dataset.label + ': ' + context.parsed.y + '%'; } } }
          },
          scales: {
            y: { beginAtZero: true, grid: { color: 'rgba(255, 255, 255, 0.05)', drawBorder: false }, ticks: { callback: function(value) { return value + '%'; }, padding: 10 } },
            x: { grid: { display: false, drawBorder: false }, ticks: { padding: 10 } }
          },
          interaction: { mode: 'nearest', axis: 'x', intersect: false }
        }
      });
    }

    // Auto-unlock session check on load
    window.addEventListener('DOMContentLoaded', async () => {
      const session = localStorage.getItem('puffy_session');
      if (session) {
        try {
          const { password, timestamp } = JSON.parse(session);
          // 30 minutes expiry (30 * 60 * 1000 = 1800000 ms)
          if (Date.now() - timestamp < 1800000) {
            await unlock(password);
          } else {
            localStorage.removeItem('puffy_session');
          }
        } catch (e) {
          localStorage.removeItem('puffy_session');
        }
      }
    });
  </script>
</body>
</html>

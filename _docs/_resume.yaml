# =============================================================================
# MASTER RESUME — Justin Clarke
# =============================================================================
# This is the SINGLE SOURCE OF TRUTH. It holds everything, including bullets
# that get cut from any given tailored version. Tailoring = SELECTION, not
# rewriting: filter accomplishments by `tags` + `strength`, swap the headline
# and summary variant, reorder the skills block to lead with what the role asks.
#
# HOW TO TAILOR (prompt an AI with this file):
#   "Build a Data Analyst resume: pull `signature` + `strong` bullets tagged
#    `data-analyst`, lead skills with SQL/Python/Power BI/DAX, use the
#    `data-analyst` headline + summary, 1 page."
#
# HOW TO UPDATE:
#   Add a new accomplishment under the right `experience`/`projects` entry with
#   the next free id (e.g. vns-09), fill text/metric/skills/tags/strength.
#   Bump meta.last_updated. Inline `# notes` are for you/the AI, never printed.
#
# FIELD GLOSSARY:
#   text     -> the canonical resume bullet, polished, ready to print
#   metric   -> the headline number in that bullet (for quick scanning/ranking)
#   skills   -> technologies/skills this bullet evidences
#   tags     -> which role archetypes this bullet should surface for
#   strength -> signature (must-include) | strong (include if room) | supporting (filler/depth)
#   variants -> OPTIONAL role-specific rephrasings. Same achievement, different emphasis.
#               If a variant exists for the role you're tailoring to, use it INSTEAD of `text`.
#
# TAILORING RECIPES:
#   The `tailoring_recipes` section (below role_targets) encodes, per role, the exact
#   bullet order, what to cut, and where projects go. If a recipe exists for your target
#   role, follow it; otherwise fall back to tags + strength selection.
# =============================================================================

meta:
  schema_version: 1
  last_updated: 2026-06-17
  owner: Justin Clarke
  source_of_truth_notes: |
    Off The Pace figures here are swept from the repo's compiled manifests
    (dbt manifest.json, ml manifest.json) and are AUTHORITATIVE. If the GitHub
    README or any portfolio page disagrees, fix the README to match THIS file.

# -----------------------------------------------------------------------------
# Role archetypes. Every accomplishment is tagged against one or more of these.
# -----------------------------------------------------------------------------
role_targets:
  - id: data-analyst        # lead: customer KPI tracking, stakeholder translation
  - id: analytics-engineer  # lead: dbt, pipeline architecture, testing rigour
  - id: bi-developer        # lead: Power BI, DAX, data modelling, RLS, Fabric
  - id: ml-engineer         # lead: XGBoost->ONNX, feature engineering, calibration, leakage audit
  - id: frontend            # lead: React/TS, data-products, in-browser data apps
  - id: agentic-ai          # lead: lineage agent, ChromaDB, knowledge-graph tooling

# -----------------------------------------------------------------------------
# Tailoring recipes. Per-role assembly instructions: title overrides, bullet
# order, cuts, and project placement. Follow the recipe for the target role;
# fall back to tags + strength when no recipe exists. `use_variant: true` means
# prefer the bullet's role variant text over its canonical `text`.
# -----------------------------------------------------------------------------
tailoring_recipes:
  - id: recipe-analytics-engineer
    for: analytics-engineer
    headline: head-analytics-engineer
    summary: sum-analytics-engineer
    title_overrides:
      vns: Analytics Engineer        # (conservative alt: "BI Developer / Analytics Engineer")
    experience_order:
      vns:
        # lead with pipelines/ETL, push pure-BI bullets down, cut the weakest
        order: [vns-02, vns-03, vns-06, vns-08, vns-05, vns-09, vns-04]
        use_variant: true            # vns-02/05/06/08 + vns-04 have AE variants below
        cut: [vns-10]                # weakest; deployment/release adds little here
        include_if_room: [vns-07, vns-01, vns-11]
    project_order:
      # Off The Pace goes DIRECTLY under VNS for AE applications — these three
      # bullets are stronger AE signals than most candidates with 3-5 yrs experience
      first: off-the-pace
      lead_bullets: [otp-02, otp-01, otp-04]
      then: [litestore, spotify-engine, sql-disaster, hr-archetype]
    skills_lead: analytics-engineering
    notes: |
      Rationale: vns-02 first answers ETL/SQL/pipelines/Fabric/Lakehouse in one line.
      vns-08 (source-to-target validation) is a differentiator — most AE resumes are
      weak on data quality. vns-04 kept last because AEs do care about dimensional
      modelling, but it reads BI-first, so use its AE variant.


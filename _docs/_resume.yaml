summaries:
  # -- ADDED 2026-09-10 -------------------------------------------------------
  # Convention held from the existing variants: implied-subject fragments, no "I",
  # no metrics (the body carries them), no technology dump. State a stance.
  - id: sum-data-engineer
    for: [data-engineer, data-platform-engineer]
    text: >
      Data engineer who builds pipelines that fail loudly. Has taken raw source data through
      ingestion, a tested warehouse layer and CI-gated publication to a served product —
      including a mathematical invariant the build refuses to violate — and has run
      multi-source ETL in Microsoft Fabric for paying clients. dbt, DuckDB, SQL, Python,
      GitHub Actions, Terraform.
    notes: |
      "Fail loudly" is the whole positioning: most candidates at this level can build a
      pipeline, and far fewer can say what happens when it silently goes wrong. otp-01 and
      otp-02 are the proof, and vns-01/vns-03 stop it reading as unpaid-only.

  - id: sum-backend-engineer
    for: [backend-engineer]
    text: >
      Backend engineer working in TypeScript and Node. Builds Fastify services on PostgreSQL
      with tenant isolation enforced by the database rather than by application code, queue-
      backed workers for asynchronous work, and test suites large enough to refactor behind.
      Also contributes fixes to open-source data tooling in Python.
    notes: |
      Lead evidence is SecureNest (sn-01, sn-03, sn-06) and Ibis (oss-01). The last sentence
      is doing real work — it is the answer to "has he written code anyone else reviewed".

  - id: sum-platform-engineer
    for: [platform-engineer]
    text: >
      Platform engineer focused on the path from commit to production. Runs a seven-stage
      data pipeline on keyless federated auth with a post-publish verification gate that
      rolls staging back when published output diverges from the build, and codifies the
      cloud footprint as Terraform so setup is reviewable rather than remembered.

  - id: sum-software-engineer
    for: [software-engineer]
    text: >
      Software engineer across TypeScript, Python and SQL, most at home where an application
      meets the data underneath it. Ships tested code — thousands of tests across production
      React, Node services and Python ML — and works to other people's conventions when the
      codebase is not his, including an upstream fix to a widely used Python data library.

  - id: sum-ai-systems-engineer
    for: [ai-systems-engineer, applied-ai-engineer]
    text: >
      AI systems engineer building the machinery around the model rather than the prompt
      inside it: typed tool protocols with bounded, provably terminating loops, execution
      guards, and validators that strip any claim not backed by executed evidence. Every
      mechanism is measured against a recorded baseline before it ships. Design principle:
      the model decides what is interesting; it never decides what is true.

  - id: sum-ml-platform-engineer
    for: [ml-platform-engineer]
    text: >
      ML platform engineer covering the path from feature mart to served model: a five-model
      gradient-boosted suite trained under season-grouped cross-validation, exported to ONNX
      with verified numerical parity, conformally calibrated, and gated in CI on a leakage
      audit plus a beats-baseline check. Model cards and documentation regenerate from the
      run manifest, so governance artifacts cannot drift from the model they describe.

  - id: sum-research-engineer
    for: [research-engineer]
    text: >
      Research engineer who writes the acceptance criteria before the run. Designs
      ablations, screens for contamination, keeps mechanical gates separate from human
      judgement, and stores results as immutable append-only artifacts that can be rescored
      without re-spending inference budget. Has published results that contradicted the
      product direction — and then changed the product.
    notes: |
      This is the archetype where DataScope's eval programme is not a supporting detail but
      the entire application. ds-06, ds-11, ds-12, ds-09 in that order.

  - id: sum-f1-performance-software
    for: [f1-performance-software]
    text: >
      Engineer building F1 performance analysis from timing and telemetry data. Decomposes
      every lap of seven seasons into named physical causes — fuel, compound, track rubber,
      ambient, car, dirty air, driver — separates driver skill from car advantage with a
      two-way fixed-effects panel model, and serves tyre-degradation and stint-life
      predictions to a browser app with no server behind it.
    notes: |
      Motorsport employers only. Do not include the "no server behind it" clause for a
      trackside/embedded role — it is a cost story, and there the interesting story is the
      modelling. Swap in otp-10 (survival analysis) if the JD mentions tyre or strategy.

  - id: sum-motorsport-data-scientist
    for: [motorsport-data-scientist]
    text: >
      Data scientist and ML engineer: Takes F1 timing and telemetry from raw data to deployed,
      CI-gated models. Separates driver from car, models tyre degradation, and holds every
      model to a baseline.
    notes: |
      ADDED 2026-09-22 for the FIA application. Kept to two printed lines. "Holds every
      model to a baseline" is accurate: the gate is beats-baseline, which all five pass.
      The significance caveat (4 of 5) belongs in the bullet, not the summary.

  - id: sum-general
    for: [general, product-developer, ai-engineer]
    text: >
      Data and AI engineer working where language models meet production databases — the point
      at which a confident answer and a correct answer stop being the same thing. Builds both
      the data platform and the evaluation that keeps what sits on top of it honest.
    notes: |
      REWRITTEN 2026-08-17, then REGISTER-CORRECTED the same day. The first rewrite read
      "I build both sides of it, and I test the side that lies" — rejected, correctly, as too
      informal. Two specific faults, worth remembering when writing any future variant:
        1. FIRST PERSON. UK and Gulf CV convention drops the pronoun and uses implied-subject
           fragments ("Builds...", "Led..."). This is convention, not taste — no variant in this
           file should use "I" unless the target is a startup or a personal-site bio.
        2. A PUNCHLINE. "...the side that lies" is a closer, not a claim. It lands with a
           founder and grates on a bank, a Big Four consultancy, or an HR screener — which is
           most of the application volume from Dubai.
      What survived is the POSITIONING, which was never the problem.

      Still deliberately carries NO metrics and NO technology list. The body is dense with both;
      repeating them here spends the reader's most valuable three seconds on information they
      are about to get anyway. This states a stance instead.

      Load-bearing dual positioning: "Data and AI engineer" claims the AI ground without
      conceding the data-engineering ground, so one resume serves both lanes without a rewrite.
      Do not narrow it unless the JD is unambiguous.

      Pairs with head-general. Availability and visa status live in the contact line — do not
      repeat them here, it costs a line.
    variants:
      - for: formal
        text: >
          Data and AI engineer focused on the boundary between production data systems and the
          language models increasingly placed on top of them — building the pipelines, the tests
          that guard them, and the evaluation that keeps model output accountable to the data
          underneath.
        notes: |
          No rhetorical turn at all, but still states a stance rather than listing outputs.
          Use for established enterprises and any employer whose own writing is formal.
      - for: conventional
        text: >
          Data and AI engineer with a background spanning analytics engineering, production data
          pipelines, and the evaluation of LLM-based systems. Focused on data platforms that are
          verifiable and AI features held to the same standard.
        notes: |
          The safe cut — nothing here for anyone to object to. Correct choice ONLY for volume
          applications through large-corporate ATS pipelines, where a distinctive line is pure
          downside risk and keyword coverage matters more than being remembered.
      - for: technical-reader
        text: >
          Data engineer, increasingly an AI engineer. Working principle: the model decides what
          is interesting, it never decides what is true. Builds the pipelines, the tests that
          guard them, and the evaluation that keeps whatever AI sits on top of them honest.
        notes: |
          For a technical reader (founder, engineering manager, AI lab) where the summary is
          read by someone who will probe it. The principle is the actual design rule behind
          ds-07, so it survives being probed — do not use it in front of a reader who cannot
          follow up on it, since unbacked it sounds like a slogan.

  - id: sum-data-analyst
    for: [data-analyst, bi-developer]
    text: >
      Data Product Engineer with 2+ years turning operational data from POS, ERP and
      e-commerce systems into automated KPI reporting that business leaders actually use.
      Strong in SQL, Python, Power BI and DAX; comfortable translating ambiguous business
      requirements into validated, reconciled metrics. Dubai-based, immediately available.
  - id: sum-analytics-engineer
    for: [analytics-engineer]
    text: >
      Analytics engineer building tested, reproducible data layers. Architects medallion
      pipelines (FastF1/Jolpica -> Hive-partitioned Parquet -> dbt on DuckDB) with 400+
      CI-enforced tests and CI-gated invariants, and has automated multi-source ETL in
      Microsoft Fabric in production. dbt, SQL, Python, incremental loading, data contracts.
  - id: sum-ml-engineer
    for: [ml-engineer]
    text: >
      ML engineer focused on physics-grounded features and honest evaluation. Built a 5-model
      gradient-boosted suite (quantile trio + classifier + regressor) over 30+ engineered
      features, exported to ONNX for in-browser inference with conformal calibration, a
      CI-enforced leakage spine, and beats-baseline gating across season-grouped splits.
  - id: sum-frontend
    for: [frontend]
    text: >
      Front-end engineer for data products. Builds production React + TypeScript apps that
      turn high-volume datasets into fast interactive tools — including a zero-backend F1
      analytics SPA running DuckDB-Wasm SQL and ONNX inference fully client-side at sub-10ms.
  - id: sum-ai-engineer
    for: [ai-engineer]
    text: >
      AI engineer working on the reliability layer: making LLM systems verifiably unable to
      assert what they cannot cite. Runs a preregistered evaluation programme — a 58-question
      NL→SQL harness across four providers, a 408-call grounding ladder, and typed
      evidence-loop architectures where the model plans analysis but never writes SQL and
      every retained claim carries executed evidence. Design principle: the model decides
      what is interesting; it never decides what is true.


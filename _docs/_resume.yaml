        text: >
          Separated request-path work from background work with Redis/BullMQ queue workers on
          their own runtime, driven by a transactional outbox so an event is never published
          without the database change that caused it, and covered the whole surface — gate
          decisions, visit lifecycle, overstay handling, billing, notifications — with 1,149
          tests that run against a real database and Redis rather than mocks.
        metric: queue-backed workers, transactional outbox, 1,149 integration-level tests

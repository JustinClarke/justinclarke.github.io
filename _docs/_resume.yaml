        notes: |
          ADDED 2026-09-10. The two details that distinguish this from every other "built a
          Node backend" bullet, and both are worth raising unprompted:

          (1) TRANSACTIONAL OUTBOX. It is the correct answer to dual-write inconsistency
              between a database and a queue, and it is a pattern most candidates at this
              level have not heard of, let alone implemented.

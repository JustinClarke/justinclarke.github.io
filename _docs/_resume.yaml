  - id: duckchat
    name: DuckChat
    tagline: "Local-first natural-language querying over DuckDB — with a deterministic SQL repair layer and an ablation programme measuring what actually helps a small model."
    role: Sole creator
    status: Complete / actively benchmarked
    links:
      repo: github.com/JustinClarke/duckchat
    stack: [Node.js, JavaScript, DuckDB-Wasm, Ollama, SQL]
    canonical_stats:   # AUTHORITATIVE — recomputed 2026-09-10 from docs/baselines/*.json
      benchmark: "72 labelled questions; every baseline JSON carries its own model id and git SHA"
      best_score: "69/72 (qwen3.5:4b, V23_gateall strategy, SHA 377e711)"
      repair_ablation: "62/72 with deterministic repairs OFF vs 68/72 with them ON — same model, same SHA"
      model_size_result: "at one fixed SHA (66c87f5) qwen3.5:4b scored 62/66 while the larger qwen3.5:9b scored 57/66 and 60/66"
      small_models: "qwen2.5-coder:1.5b 50/72; qwen3:1.7b 48/72"
      tests: "71 passing (`node --test test/*.test.js`, 2026-09-10) plus 7 assertion scripts in `npm test`"
      source_loc: 5455
    accomplishments:
      - id: dc-01
        text: >
          Built a local-first natural-language query tool over DuckDB where the model never
          touches the database: generated SQL passes a read-only guard that rejects anything
          but SELECT/WITH, and a deterministic repair layer rewrites three fault classes that
          are wrong by definition — a GROUP BY key missing from the SELECT list, a duration
          divided by the wrong constant, a signed amount summed as if money moved one way.
        metric: read-only guard + 3 mechanically-decidable repair classes
        skills: [Node.js, DuckDB, SQL parsing, NL-to-SQL, local inference, Ollama]
        tags: [ai-systems-engineer, applied-ai-engineer, backend-engineer, data-engineer, ai-engineer]
        strength: signature
        evidence: "duckchat/src/repair.js, src/sql-text.js, src/ask.js"
        notes: |
          The distinguishing idea, and the one to lead with: a repair only fires on SQL that
          ALREADY RUNS, a retry only on SQL that does not, and the project's own README says
          plainly that neither can tell whether the answer is correct. That last clause is
          the tell — most people building this write "self-correcting AI" and stop there.

          Do NOT describe this as "an AI chatbot for data". It is a constrained NL→SQL
          pipeline whose interesting content is the guard, the repair taxonomy, and the
          measurement of both.

      - id: dc-02
        text: >
          Quantified what the repair layer was actually worth by re-running the full
          72-question benchmark at a fixed commit with repairs disabled: 62/72 without them
          against 68/72 with them, isolating the mechanism's contribution instead of assuming
          it — and separately found a 4B model outscoring a 9B one on the same harness,
          62/66 to 57/66.
        metric: repair ablation +6/72; 4B beat 9B at identical commit
        skills: [ablation design, benchmarking, evaluation, NL-to-SQL, experiment design]
        tags: [research-engineer, ai-engineer, applied-ai-engineer, ml-engineer, ai-systems-engineer]
        strength: signature
        evidence: "duckchat/docs/baselines/4b-s59-fitoff-62of72.json vs 4b-s60-gfil-example-68of72.json (both SHA 377e711); 4b-run2.json 62/66 vs 9b-run1.json 57/66 and 9b-run2.json 60/66 (all SHA 66c87f5)"
        notes: |
          Both halves matter and they make different points.

          The ABLATION is the methodological point: he turned his own feature off to find out
          whether it earned its place. Every baseline file records its model id and git SHA,
          so the comparison is genuinely like-for-like — that provenance discipline is why

  - id: analytics-engineer  # lead: dbt, pipeline architecture, testing rigour
  - id: bi-developer        # lead: Power BI, DAX, data modelling, RLS, Fabric
  - id: ml-engineer         # lead: XGBoost->ONNX, feature engineering, calibration, leakage audit
  - id: frontend            # lead: React/TS, data-products, in-browser data apps

# -----------------------------------------------------------------------------
# Tailoring recipes. Per-role assembly instructions: title overrides, bullet
# order, cuts, and project placement. Follow the recipe for the target role;
# fall back to tags + strength when no recipe exists. `use_variant: true` means
# prefer the bullet's role variant text over its canonical `text`.
# -----------------------------------------------------------------------------
tailoring_recipes:
  - id: recipe-analytics-engineer
    for: analytics-engineer
    headline: head-analytics-engineer
    summary: sum-analytics-engineer
    title_overrides:
      vns: Analytics Engineer        # (conservative alt: "BI Developer / Analytics Engineer")
    experience_order:
      vns:
        order: [vns-02, vns-01, vns-03, vns-04, vns-05]
        use_variant: false
        cut: []
        include_if_room: []
    project_order:
      # Off The Pace goes DIRECTLY under VNS for AE applications — these three
      # bullets are stronger AE signals than most candidates with 3-5 yrs experience
      first: off-the-pace
      lead_bullets: [otp-02, otp-01, otp-04]
      then: [litestore, spotify-engine, sql-disaster, hr-archetype]
    skills_lead: analytics-engineering
    notes: |
      Rationale: For AE applications, we lead with SQL/Data Prep (vns-02) then BI (vns-01).
      The heavy AE engineering narrative is driven entirely by the Off The Pace project.


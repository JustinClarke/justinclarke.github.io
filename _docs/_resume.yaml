    skills_lead: analytics-engineering
    notes: |
      Rationale: lead with pipeline construction (vns-01), then the optimization win (vns-02),
      then the testing/validation habit (vns-03) — that ordering IS the narrative arc in
      miniature, and it hands off directly to Off The Pace's 443 CI tests.
      The heavy AE engineering narrative is driven by Off The Pace: otp-02 (60 models, 443
      tests) then otp-01 (the enforced invariant) then otp-12 (the 7-stage CI pipeline with
      auto-rollback). Swap otp-12 for otp-04 if the JD mentions ML or feature stores.

  - id: recipe-general
    for: [general, product-developer]
    headline: head-general
    summary: sum-general
    # title_overrides: none — the vns entry's own title (Analytics Engineer) is correct
    # since the 2026-09-10 reframing. See that entry's honesty_note.
    experience_order:
      datascope: {order: [ds-01, ds-02, ds-06, ds-08, ds-10], cut: [ds-03, ds-04, ds-05, ds-07, ds-09, ds-11, ds-12]}
      vns:       {order: [vns-01, vns-02, vns-05, vns-03, vns-04], cut: [vns-06, vns-07, vns-08, vns-09]}
      litestore: {order: [lite-01, lite-06, lite-02, lite-09], cut: [lite-03, lite-04, lite-05, lite-07, lite-08]}
    project_order:
      first: off-the-pace
      lead_bullets: [otp-01, otp-09, otp-02, otp-03]
      then: []
    skills_lead: analytics-engineering
    notes: |
      THE DEFAULT ONE-PAGER. Optimised for a mixed audience — the first reader is usually a
      recruiter 1-2 years out of university who is keyword-matching, not evaluating engineering.

      The governing rule for this cut is DUAL LEGIBILITY: every bullet must land twice.
      Clause 1 = a number and a plain-English outcome anyone can grasp. Clause 2 = the technical
      mechanism that earns respect from the hiring manager who reads it later. Jargon goes at
      the END of a sentence, never the start.
        BAD:  "Implemented a two-way HDFE panel regression to separate car quality from driver..."
        GOOD: "Separated driver skill from car advantage across 137,447 laps — using a two-way
               high-dimensional fixed-effects panel regression..."
      Same facts, same honesty; only the reading order changed, and the second version survives
      a six-second scan.

      Other rules for this cut:
      - Front-load every metric. "Cut refresh times from ~45 to ~20 minutes" beats "Optimized
        pipelines, reducing refresh times...". The digit should be in the first 6 words.
      - PAGE BUDGET (corrected 2026-08-17 — the first draft of this recipe said 18 bullets and
        did NOT fit; the printed PDF spilled the skills block onto page 2).
        One page at 10pt = ~45 lines. Fixed overhead (name, contact, summary, 4 entry headers,
        education, skills) eats ~22 of them. That leaves ~23 lines for bullets, so the real
        budget is 14 BULLETS AVERAGING 1.5 LINES — roughly 160 characters each, hard cap.
        Allocation: DataScope 4, Off The Pace 3, Independent 4, LiteStore 3.
      - Compression is done by MERGING, not by deleting facts. Three merges make the budget:
        ds-01 absorbs ds-02's schema inference; otp-02/03/05 collapse into one platform bullet
        (60 dbt models -> 5 ML models -> ONNX -> React app is one sentence, not three);
        lite-02 absorbs lite-09's handoff. Every number survives.
      - If it still spills, cut in this order: lite-09's handoff clause, then vns-04,
        then otp-09. Never cut ds-06.
      - Never open a bullet with "Responsible for", "Assisted in", or "Worked on".
      - ds-11 and ds-07 are CUT here despite being signature bullets. They are the two most
        technically impressive things in the file and the two least legible to a non-technical
        reader. They belong in recipe-ai-engineer, not the general cut. Swap ds-02 -> ds-11 the
        moment the JD mentions LLMs, evals, or inference.

  - id: recipe-ai-engineer
    for: ai-engineer
    headline: head-ai-engineer
    summary: sum-ai-engineer
    title_overrides:
      datascope: "Founder / AI Engineer"
    experience_order:
      datascope:
        # LEAD WITH THE EVAL PROGRAMME, NOT THE APP. ds-06 is the differentiator:
        # almost nobody applying to these roles has preregistered evals with a
        # published negative result. The app (ds-01) is context for why the evals exist.
        # ds-11 added 2026-08-17, placed second: it converts "one striking experiment"
        # into "a programme", which is the objection ds-06 alone invites.
        order: [ds-06, ds-11, ds-12, ds-07, ds-08, ds-03, ds-01]
        use_variant: false
        cut: [ds-04]
        include_if_room: [ds-09, ds-10, ds-02, ds-05]  # ds-10 early when seniority is the question
      vns:
        order: [vns-03, vns-01]   # validation habit first, then pipeline scale
        cut: [vns-02, vns-04, vns-05, vns-06, vns-07, vns-08, vns-09]
    project_order:
      first: off-the-pace
      lead_bullets: [otp-04, otp-03, otp-05]   # leakage audit first — it is ML-reliability work
      then: [spotify-engine, hr-archetype]
    skills_lead: ai-evals
    notes: |
      Rationale: The market gap is *reliability*, not "can call an LLM API". Every bullet
      selected here is about constraining a model, measuring it honestly, or proving it
      wrong — not about shipping chat. ds-06 (the negative result) is the single most
      credible bullet in this file for AI-lab and applied-AI hiring, because publishing a
      result that contradicts the intuition of the person publishing it is the costly
      signal that separates evaluation work from marketing.

      ds-06 -> ds-11 is the intended one-two: a striking negative result, immediately
      followed by evidence that it came out of a systematic programme (19 experiment designs,
      12 built harnesses) rather than a single lucky run. Leading with ds-06 alone invites
      "nice anecdote"; the pair does not.

      vns-03 leads the independent entry here on purpose — "cross-source reconciliation and
      automated quality checks" is the paid precedent for the whole eval programme, and it
      pre-empts the "this rigour is all unpaid side-project rigour" read.
      Pair with the two public write-ups (see _docs/misc/2026-07-31-career-strategy.md);
      the resume points at them, they carry the depth.

  # ===========================================================================
  # RECIPES ADDED 2026-09-10.
  # Shared budget rule inherited from recipe-general: ~14 bullets at ~160 chars.
  # Every id below was checked against the master list on 2026-09-10.
  # NOTE ON TITLES: none of these overrides Justin's level upward. There is no
  # senior/lead/staff recipe in this file, on purpose — see narrative.positioning_notes.
  # ===========================================================================

  - id: recipe-data-engineer
    for: [data-engineer, data-platform-engineer]
    headline: head-data-engineer
    summary: sum-data-engineer
    # title_overrides: none — the vns entry's own title (Analytics Engineer) is correct
    # since the 2026-09-10 reframing. See that entry's honesty_note.
    experience_order:
      vns:       {order: [vns-01, vns-02, vns-03, vns-05], cut: [vns-04, vns-06, vns-07, vns-08, vns-09]}
      datascope: {order: [ds-02, ds-01], cut: [ds-03, ds-04, ds-05, ds-06, ds-07, ds-08, ds-09, ds-10, ds-11, ds-12]}
    project_order:
      first: off-the-pace
      lead_bullets: [otp-02, otp-01, otp-12, otp-13]
      then: [ibis-oss, duckchat, sql-disaster]
      project_bullets: {ibis-oss: [oss-01], duckchat: [dc-03], sql-disaster: [sqld-01]}
    skills_lead: data-engineering
    notes: |
      THE STRONGEST NEW LANE, and the one with the most job volume of the ten added here.

      Order is deliberate: otp-02 (72 models, 639 tests) establishes scale, otp-01 (the
      enforced invariant) establishes that he thinks about correctness differently from most
      applicants, otp-12/otp-13 establish that he can operate it — the seven-stage pipeline
      with auto-rollback and the Terraform footprint are what separate a data engineer from
      an analyst who writes dbt.

      oss-01 is the differentiator against the rest of the applicant pool. Most data-engineer
      candidates at this level have never contributed to the tools they use. He fixed a
      compiler bug in one, across 19 backends. It also lands the Python-depth point without
      needing a "Python: advanced" self-rating.

      dc-03 (schema-free ingestion by structural shape) is included over dc-01/dc-02 because
      messy heterogeneous ingestion is the actual daily work of the job.
      Cut vns-06 here — Power BI dashboards pull toward the analyst read of his profile.

  - id: recipe-backend-engineer
    for: [backend-engineer]
    headline: head-backend-engineer
    summary: sum-backend-engineer
    experience_order:
      datascope: {order: [ds-05, ds-10], cut: [ds-01, ds-02, ds-03, ds-04, ds-06, ds-07, ds-08, ds-09, ds-11, ds-12]}
      vns:       {order: [vns-04, vns-07, vns-08], cut: [vns-01, vns-02, vns-03, vns-05, vns-06, vns-09]}
    project_order:
      first: securenest
      lead_bullets: [sn-01, sn-03, sn-06, sn-04]
      then: [ibis-oss, duckchat, off-the-pace]
      project_bullets: {ibis-oss: [oss-01, oss-02], duckchat: [dc-01], off-the-pace: [otp-12]}
    skills_lead: backend-engineering
    notes: |
      SecureNest leads — this is the only recipe in the file where it does, and it is the
      right call: 1,149 green tests, 63 models, RLS-enforced tenancy and queue workers is a
      more complete backend story than anything else here.

      sn-03 (row-level security) then sn-06 (outbox + non-mocked tests) is the pairing that
      wins this application. Both are patterns that signal someone who has thought about
      failure modes rather than someone who has wired up CRUD routes.

      oss-02 earns its place ONLY in this recipe and recipe-software-engineer, because
      "responds well to code review" is a live hiring question for backend teams and dead
      weight everywhere else.

      Honest framing to hold: SecureNest is not deployed. Say "built and tested,
      pre-deployment" if asked. Do not let the recipe's prominence imply live traffic.

  - id: recipe-platform-engineer
    for: [platform-engineer]
    headline: head-platform-engineer
    summary: sum-platform-engineer
    experience_order:
      datascope: {order: [ds-05, ds-09], cut: [ds-01, ds-02, ds-03, ds-04, ds-06, ds-07, ds-08, ds-10, ds-11, ds-12]}
      vns:       {order: [vns-05, vns-09], cut: [vns-01, vns-02, vns-03, vns-04, vns-06, vns-07, vns-08]}
    project_order:
      first: off-the-pace
      lead_bullets: [otp-12, otp-13, otp-14, otp-15]
      then: [securenest, duckchat]
      project_bullets: {securenest: [sn-06], duckchat: [dc-04]}
    skills_lead: platform-devops
    notes: |
      Off The Pace's platform layer is unusually complete for a personal project and this
      recipe is simply that layer in order: pipeline (otp-12), IaC (otp-13), supply chain
      (otp-14), observability (otp-15).

      The two clauses to make sure survive editing, because they are what a platform
      interviewer actually reacts to: KEYLESS Workload Identity Federation (no long-lived
      service-account keys) and the post-publish verification gate that AUTO-ROLLS-BACK when
      published CDN output diverges from the build. Anyone can list GitHub Actions.

      dc-04 is small but thematically perfect here — CI that fails when the benchmark's own
      dataset changes is reproducibility enforced by the platform, not by discipline.

      WEAKEST OF THE TEN NEW LANES. All the evidence is self-directed: no on-call, no
      incident response, no multi-team infrastructure, no Kubernetes. Apply to platform roles
      at data-heavy companies where the pipeline work reads as adjacent; do not apply to pure
      SRE postings on the strength of this recipe.

  - id: recipe-software-engineer
    for: [software-engineer]
    headline: head-software-engineer
    summary: sum-software-engineer
    # title_overrides: none — see recipe-general's note; the vns entry is plain employment.
    experience_order:
      datascope: {order: [ds-01, ds-05, ds-10], cut: [ds-02, ds-03, ds-04, ds-06, ds-07, ds-08, ds-09, ds-11, ds-12]}
      vns:       {order: [vns-07, vns-08, vns-04], cut: [vns-01, vns-02, vns-03, vns-05, vns-06, vns-09]}
      litestore: {order: [lite-01, lite-02], cut: [lite-03, lite-04, lite-05, lite-06, lite-07, lite-08, lite-09]}
    project_order:
      first: securenest
      lead_bullets: [sn-01, sn-06]
      then: [ibis-oss, off-the-pace]
      project_bullets: {ibis-oss: [oss-01, oss-02], off-the-pace: [otp-05]}
    skills_lead: languages
    notes: |
      THE GENERALIST FALLBACK, and the right choice whenever a JD says "software engineer"
      without a data or AI qualifier — which is a large share of the market.

      Strategy: breadth demonstrated by range rather than asserted by list. A tested Node
      backend (sn-01/sn-06), a large TypeScript frontend (ds-01/otp-05), and Python in
      someone else's repo (oss-01) covers the stack without a single self-rating.

      lite-02 stays because a measured 3.0s -> 0.6s page-load improvement is legible to every
      engineer alive, needs no domain context, and is the oldest evidence in the file that he
      optimises against numbers rather than vibes.

      Lead skills with `languages` here — three languages, all evidenced. Resist the urge to
      pad it for ATS; see that group's notes.

  - id: recipe-ai-systems-engineer
    for: [ai-systems-engineer, applied-ai-engineer]
    headline: head-ai-systems-engineer
    summary: sum-ai-systems-engineer
    title_overrides:
      datascope: "Founder / AI Engineer"
    experience_order:
      datascope: {order: [ds-07, ds-03, ds-12, ds-08, ds-01], cut: [ds-02, ds-04, ds-05, ds-06, ds-09, ds-10, ds-11]}
      vns:       {order: [vns-03], cut: [vns-01, vns-02, vns-04, vns-05, vns-06, vns-07, vns-08, vns-09]}
    project_order:
      first: duckchat
      lead_bullets: [dc-01, dc-02]
      then: [off-the-pace]
      project_bullets: {off-the-pace: [otp-04]}
    skills_lead: ai-systems
    notes: |
      DISTINCT FROM recipe-ai-engineer, and the distinction is worth holding onto.
      recipe-ai-engineer sells EVALUATION — measuring models honestly. This one sells
      SYSTEM DESIGN — the machinery that makes an unreliable component safe to build on.
      Read the JD: "evals/benchmarks/model quality" -> recipe-ai-engineer. "agents, tool
      calling, RAG, production LLM features" -> this one.

      ds-07 leads because the typed evidence loop is the purest statement of the thesis: the
      model plans, DuckDB executes, a validator strips any claim whose numbers are not in its
      cited evidence. Follow with ds-03 (three tiers, one pipeline, graded by one harness),
      then ds-12 so the design decisions are visibly measured rather than asserted.

      DuckChat leads the projects here rather than Off The Pace because dc-01's guard-plus-
      repair architecture is the same idea at a scale an interviewer can hold in their head
      — and dc-02 proves the repair layer was worth building instead of assuming it.

      Have the bounded-loop detail ready: 24 provider round-trips, 48 total operations, three
      CONSECUTIVE failures rather than cumulative, and a termination guarantee that holds
      regardless of what the model emits. That level of specificity is the whole interview.

  - id: recipe-ml-platform-engineer
    for: [ml-platform-engineer]
    headline: head-ml-platform-engineer
    summary: sum-ml-platform-engineer
    experience_order:
      datascope: {order: [ds-09], cut: [ds-01, ds-02, ds-03, ds-04, ds-05, ds-06, ds-07, ds-08, ds-10, ds-11, ds-12]}
      vns:       {order: [vns-01, vns-03], cut: [vns-02, vns-04, vns-05, vns-06, vns-07, vns-08, vns-09]}
    project_order:
      first: off-the-pace
      lead_bullets: [otp-03, otp-04, otp-12, otp-08, otp-07]
      then: [spotify-engine]
      project_bullets: {spotify-engine: [spot-02]}
    skills_lead: ml-engineering
    notes: |
      Sells the PATH rather than the model: feature mart -> tuning -> ONNX export with
      verified parity -> calibration -> gated promotion -> served inference -> regenerated
      model card. Use the otp-03 `ml-platform-engineer` variant, which is written for exactly
      this ordering.

      otp-04 second on purpose: a leakage audit that runs in CI is MLOps, not modelling, and
      it is the bullet that says he has thought about how training silently goes wrong.

      otp-08 matters more here than in any other recipe — model cards regenerated from the
      run manifest and drift-gated in CI is model governance, which is increasingly the job.

      Caveat to hold honestly: there is no online serving, no feature store, no retraining
      schedule and no production model monitoring in this evidence. This is a strong
      batch-training-to-static-serving story. Do not stretch it to real-time ML platforms.

  - id: recipe-research-engineer
    for: [research-engineer]
    headline: head-research-engineer
    summary: sum-research-engineer
    title_overrides:
      datascope: "Founder / Research Engineer"
    experience_order:
      datascope: {order: [ds-06, ds-11, ds-12, ds-09, ds-08], cut: [ds-01, ds-02, ds-03, ds-04, ds-05, ds-07, ds-10]}
      vns:       {order: [vns-03], cut: [vns-01, vns-02, vns-04, vns-05, vns-06, vns-07, vns-08, vns-09]}
    project_order:
      first: off-the-pace
      lead_bullets: [otp-09, otp-11, otp-16]
      then: [duckchat]
      project_bullets: {duckchat: [dc-02]}
    skills_lead: research-methods
    notes: |
      THE HIGHEST-CEILING LANE IN THE FILE, and the one with the fewest openings. Worth a
      tailored application every time one appears.

      The four-bullet DataScope opening is a complete argument in order: ds-06 a negative
      result that reversed his own strategy, ds-11 evidence it came from a programme rather
      than a lucky run, ds-12 three more falsifications of his own shipped design, ds-09 the
      machinery that makes all of it reproducible.

      otp-09 (two-way HDFE separating driver from car) is the statistical-depth bullet that
      says he can identify a confound and choose the right estimator, not just call .fit().
      otp-11 must follow it — the estimate is only credible because teammate-swap and
      team-change counterfactuals exist to falsify it.

      LIKELY OBJECTION, and be ready for it: no publications, no PhD, no academic
      affiliation. The counter is that the artifacts are unusually complete for someone
      without them — preregistration written before the run, contamination screening,
      adversarial design review before spending inference budget, immutable rescorable run
      records. Offer the write-ups; they carry depth a resume line cannot.

      Best single interview answer available anywhere in this file: "what's the hardest open
      problem in your work?" -> the grain-error class from ds-11. SQL that executes cleanly
      and returns the wrong number produces no error signal, so every reliability mechanism
      in the stack — which all key off an error — has nothing to trigger on.

  - id: recipe-f1-performance-software
    for: [f1-performance-software]
    headline: head-f1-performance-software
    summary: sum-f1-performance-software
    experience_order:
      vns:       {order: [vns-01, vns-03], cut: [vns-02, vns-04, vns-05, vns-06, vns-07, vns-08, vns-09]}
      datascope: {order: [ds-01], cut: [ds-02, ds-03, ds-04, ds-05, ds-06, ds-07, ds-08, ds-09, ds-10, ds-11, ds-12]}
    project_order:
      first: off-the-pace
      lead_bullets: [otp-01, otp-09, otp-03, otp-10, otp-07, otp-05]
      then: []
    skills_lead: ml-engineering
    notes: |
      MOTORSPORT EMPLOYERS ONLY — teams, timing and telemetry vendors, race-strategy
      software, broadcast and betting analytics. Everywhere else this framing actively hurts:
      it converts a serious data-engineering portfolio into "the F1 fan".

      Nearly the whole page is Off The Pace, and that is correct here. Six bullets covering
      lap decomposition, driver-vs-car identification, tyre degradation models, survival
      analysis of the cliff, uncertainty-propagated counterfactuals, and browser delivery is
      a more complete motorsport-analytics portfolio than most applicants will have.

      otp-10 (Kaplan-Meier tyre-cliff survival across 438 groups) is the domain-credibility
      bullet — it shows he modelled the cliff as the censored-duration problem it actually
      is, rather than as a threshold rule.

      Read the JD before ordering: strategy/simulation roles -> lead otp-01 and otp-07.
      Vehicle-performance or race-engineering support -> lead otp-09 and otp-03.
      Keep the honest caveat ready: this is public FastF1/OpenF1 timing data, not team
      telemetry, and the 2025 season is a designated holdout that has not yet been ingested.

  - id: recipe-motorsport-data-scientist
    for: [motorsport-data-scientist]
    headline: head-motorsport-data-scientist
    summary: sum-motorsport-data-scientist
    date_overrides:
      off-the-pace: "Nov 2025 - present"   # dates_note: 'present' is honest (repo active) and puts it first
    experience_order:
      datascope: {order: [ds-07, ds-11], cut: [ds-01, ds-02, ds-03, ds-04, ds-05, ds-08, ds-09, ds-10, ds-12], include_if_room: [ds-06]}
      vns:       {order: [vns-01, vns-03, vns-02], merge: {vns-02: vns-05}, cut: [vns-04, vns-06, vns-07, vns-08, vns-09]}
      litestore: {order: [lite-01, lite-06], merge: {lite-01: lite-09, lite-06: lite-07}, cut: [lite-02, lite-03, lite-04, lite-05, lite-08]}
    project_order:
      first: off-the-pace        # ABOVE DataScope. Both are "present"; order by relevance.
      lead_bullets: [otp-01, otp-09, otp-17, otp-03, otp-12, otp-18]
      then: []
    skills_lead: data-science
    printed_copy: _docs/misc/resume_fia_f1_data_scientist.md
    notes: |
      First used for the FIA F1 Data Scientist role (Geneva, deadline 2026-10-04). The JD
      in one line: ML models on telemetry time series, plus the MLOps to version, track and
      deploy them, plus nice-to-haves in open-source LLMs and on-device ML.

      Off The Pace carries six bullets and goes FIRST. The order is the data-science
      lifecycle: attribution model (otp-01) -> the identification problem (otp-09) -> raw
      telemetry (otp-17) -> the ML suite with its significance caveat (otp-03) -> the
      pipeline and gates (otp-12 merged with otp-02 and otp-04) -> versioning and
      experiment tracking (otp-18). otp-18 is the honest answer to "MLflow or similar":
      hand-built, but it covers the same ground (versioned manifests, pinned provenance,
      recorded experiment runs).

      DataScope drops to two bullets, picked for the JD's nice-to-haves rather than for
      AI-engineer signal: ds-07 (grounded LLM over structured data, the pattern regulatory-
      document work needs) and ds-11 (open-source small models, on-device on WebGPU).

      VNS keeps vns-01 because the JD names PySpark. CONFIRM Fabric notebooks really ran
      PySpark before sending; if not, drop PySpark from both the bullet and the skills.

      Do NOT print the contact.work_authorization line. It is a UAE visa statement, and a
      Geneva role needs a Swiss permit. Header: "Dubai, UAE · open to relocating to Geneva".

      GAPS, deliberately left off: PyTorch, MLflow, AWS, computer vision. None has evidence.
      Wiring MLflow into ml/ would be the cheapest way to earn one of those keywords.


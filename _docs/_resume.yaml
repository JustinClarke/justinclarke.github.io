# -----------------------------------------------------------------------------
# THE NARRATIVE. Read this before assembling any resume.
#
# The standing objection to this candidate is "solo projects, not a real job."
# The counter is not more numbers — it is a visible PROGRESSION. Every entry in
# this file is a rung on one ladder, and the ladder is the hiring case.
# -----------------------------------------------------------------------------
narrative:
  thesis: >
    Justin builds data systems that can be audited, and then attacks them to find out
    where they break.
  arc: |
    The through-line is ESCALATING RIGOUR ABOUT VERIFICATION, applied at rising stakes.
    Each role does the same thing one level harder than the last:

      LiteStore (2021-2023)        measure to DECIDE, not to decorate.
                                   GA4 -> A/B experiments -> 20% conversion uplift.
                                   Sole engineer, real commercial outcome (Rs 2.2 Cr+ GMV).

      VNS Solutions (2024-2025)    verification as a professional habit.
                                   Cross-source reconciliation, automated quality checks,
                                   dashboard output checked against raw source, for paying
                                   clients on multi-million-record datasets.

      Off The Pace (2025-2026)     verification becomes MACHINE-ENFORCED.
                                   A mathematical invariant the build fails on. 443 CI data
                                   tests. An adversarial probe that PROVES a feature would
                                   leak before it can enter training.

      DataScope (2026-present)     the same instinct turned on AI itself, and on his own
                                   beliefs. Preregistered acceptance criteria written before
                                   the run. Contamination screening. A published negative
                                   result that reversed his own product strategy. Plus the
                                   first delegation: an intern held to the same gate.

      Ibis (2026)                  and finally, outward. The same habit applied to somebody
                                   else's codebase, under somebody else's review: a silent
                                   cross-backend breakage diagnosed, fixed behind a version
                                   shim, regression-tested, and revised when a maintainer
                                   asked for it. Open, not merged — and it counts anyway,
                                   because the reviewable artifact is the work.

    Stated as one line for a cover letter or a screen call:
      "I started by measuring whether my product decisions worked, and I kept raising the
       standard of proof until I was preregistering experiments that could prove me wrong —
       and then published one that did."

    SUPPORTING EVIDENCE off the main ladder, added 2026-09-10:
      SecureNest    the delivery counterweight. Whatever else is true of the two research-
                    flavoured projects, this one is 1,149 passing tests, 63 data models and
                    tenant isolation enforced by Postgres RLS. Use it whenever the objection
                    is "does he actually finish and ship things".
      DuckChat      the same NL->SQL problem as DataScope, attacked at small scale with
                    ablations instead of opinions — including the finding that a 4B model
                    beat a 9B one on his benchmark.
  positioning_notes: |
    - The two projects are NOT hobby work and must never be presented as such. Off The Pace
      and DataScope are the entries carrying the senior engineering signal; the paid roles
      carry commercial context and stakeholder evidence. Lead with whichever the JD rewards,
      but never drop the other entirely — the arc needs both ends to be legible.
    - THE GAP (reinstated 2026-09-10): Apr 2023 - Apr 2024 is now an open twelve months, by
      the owner's decision to present VNS as plain employment rather than as independent
      contract work. The timeline is no longer continuous, and that is a deliberate trade —
      a simple entry that verifies cleanly beats a defensible one that invites questions.
      If a reader raises it, the honest answer is freelance product work (vns-07/vns-08).
      Read the `vns` entry's `honesty_note` BEFORE printing vns-07 or vns-08 — under a
      VNS Solutions heading they misattribute independent projects to an employer.
    - Seniority objection ("has he ever worked with anyone?"): answer with ds-10 (recruited
      and manages an intern, reviews every PR) + lite-09 (documented a handoff and onboarded
      his own successor) + vns-06 (multi-client delivery). That is a repeated habit across
      three separate entries, not one anecdote.
    - Employment-gap objection: do not over-explain. The work is continuous and evidenced;
      2026 reads as two funded-quality engineering programmes with recorded, reproducible
      output.
    - "Never worked in someone else's codebase" objection (ADDED 2026-09-10): this was the
      one real hole in the file, and oss-01 closes it. A 20-backend change to a major OSS
      data project, conforming to that project's existing conventions, with a maintainer
      review answered. Lead with it for backend/data-platform/software-engineer roles, where
      "can he work inside constraints he didn't set" is the live question.
    - "Research projects, but does he ship?" objection (ADDED 2026-09-10): answer with
      SecureNest. 1,149 passing tests, RLS-enforced multi-tenancy, three client apps. It is
      the least glamorous entry here and the most reassuring one to a delivery-focused
      manager. Pair sn-01 with sn-06.
    - SENIORITY, restated plainly: target engineer-level roles. Do not build a "senior"
      recipe. The rigour in this file is unusual for the level and reads as high ownership;
      claiming a title the timeline does not support converts that asset into a liability
      the first time someone checks.


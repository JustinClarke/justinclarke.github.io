  - id: ibis-oss
    name: "Ibis (open source) — cross-backend SQL compiler fix"
    tagline: "Diagnosed and fixed a silent cross-backend SQL breakage in Ibis, the Python dataframe library, upstream and under maintainer review."
    role: External contributor
    status: "PR #12104 open under review (not merged) as of 2026-09-10"
    links:
      pr: github.com/ibis-project/ibis/pull/12104
      issue: github.com/ibis-project/ibis/issues/12101
    stack: [Python, sqlglot, pytest, Git]
    honesty_note: |
      SCOPE DISCIPLINE — read before printing anything from this entry.
      * The PR is OPEN and NOT MERGED. Never write or imply "merged", "accepted", "shipped
        in Ibis", "maintainer" or "committer". The claim is authorship and review response.
      * Justin authored exactly TWO commits in this checkout. A third commit that a naive
        `git log --author` match returns (3a66a9618) belongs to Justin Poehnelt of Google.
        Do not count it.
      * A second PR (#12103) exists but was opened and self-closed 45 seconds later. It is
        deliberately not mentioned anywhere. Do not pad the entry with it.
      * If the PR is later merged, upgrade the wording. If it is closed unmerged, the bullet
        below still stands exactly as written, because it does not claim acceptance.
    accomplishments:
      - id: oss-01
        text: >
          Diagnosed and fixed a silent cross-backend failure in Ibis, the Python dataframe
          library: a sqlglot upgrade renamed an argument of the DROP expression, and because
          unrecognised keyword arguments are ignored rather than raising, every SQL backend
          began emitting `DROP TABLE IF EXISTS` with no table name — a corruption that failed
          downstream instead of at the call site. Fixed it behind a version-adaptive shim and
          migrated 19 database backends onto it, with a regression test citing the issue.
        metric: 19 backends fixed behind one compatibility shim; 24 files, +138/-117
        skills: [Python, sqlglot, SQL compilers, debugging, open-source contribution, pytest]
        tags: [backend-engineer, data-engineer, software-engineer, data-platform-engineer, platform-engineer]
        strength: signature
        evidence: "ibis-project/ibis PR #12104 (open) against issue #12101; local commit cd245cd5f; reproduced on sqlglot 30.18.0 — naive call emits 'DROP TABLE IF EXISTS', shim emits 'DROP TABLE IF EXISTS \"t\"'"
        notes: |
          ADDED 2026-09-10. This is the most valuable NEW bullet in the file, because it is
          the only evidence of Justin working inside a codebase he does not own, to
          conventions he did not set. Every other entry is his own project.

          The technically interesting part, and the thing to say out loud in an interview, is
          the FAILURE MODE rather than the fix: sqlglot silently ignores unknown kwargs, so a
          renamed argument produced a syntactically valid statement with the table missing.
          Nothing raised. That is a class of bug worth being able to talk about — it fails
          far from its cause, and it is exactly the kind of thing a type checker does not
          catch.

          The shim itself is the right call rather than a clever one: `_compat.py` already
          held WITH_ARG and EXCEPT_ARG resolved the same way, so DROP_ARG follows an existing
          pattern instead of inventing a new one. Say that — "I matched what was already
          there" is a stronger engineering signal than novelty.

      - id: oss-02
        text: >
          Revised the contribution in response to maintainer review, relocating the shim into
          the project's existing compatibility module and aligning it with the conventions
          already used there rather than introducing a parallel one.
        metric: maintainer review answered and incorporated
        skills: [code review, collaboration, open-source contribution, Python]
        tags: [software-engineer, backend-engineer, data-engineer]
        strength: strong
        evidence: "PR #12104 — CHANGES_REQUESTED review by maintainer deepyaman, followed by Justin's revision comment addressing each point"
        notes: |
          ADDED 2026-09-10. Deliberately kept as its own bullet rather than folded into
          oss-01, because it answers a different objection. oss-01 answers "can he fix a hard
          bug"; this answers "what happens when someone tells him he did it wrong".

          Use it for any role where the standing worry is that a solo-project candidate will
          not take review well. Cut it first if space is tight — oss-01 carries the entry.


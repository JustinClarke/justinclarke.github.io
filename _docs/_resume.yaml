# =============================================================================
# MASTER RESUME — Justin Clarke
# =============================================================================
# This is the SINGLE SOURCE OF TRUTH. It holds everything, including bullets
# that get cut from any given tailored version. Tailoring = SELECTION, not
# rewriting: filter accomplishments by `tags` + `strength`, swap the headline
# and summary variant, reorder the skills block to lead with what the role asks.
#
# HOW TO TAILOR (prompt an AI with this file):
#   "Build a Data Analyst resume: pull `signature` + `strong` bullets tagged
#    `data-analyst`, lead skills with SQL/Python/Power BI/DAX, use the
#    `data-analyst` headline + summary, 1 page."
#
#   17 role archetypes are supported as of 2026-09-22, and 12 of them have an explicit
#   recipe under `tailoring_recipes` (motorsport-data-scientist added 2026-09-22 for the
#   FIA F1 Data Scientist application). If a recipe exists for the target role, FOLLOW IT;
#   otherwise fall back to tags + strength. The four archetypes without a recipe
#   (data-analyst, bi-developer, frontend, ml-engineer) predate the recipe system and
#   still tailor correctly from tags — write one for them the next time you apply to one.
#
# THE ONE-PAGE CONSTRAINT IS NOT NEGOTIABLE. This file is deliberately rich; a printed
# resume is not. Every recipe must be able to produce a truthful one-pager at ~14 bullets.
# When in doubt, cut a technology and keep a signature bullet — a small number of specific,
# verifiable accomplishments beats a catalogue every time.
#
# EVIDENCE DISCIPLINE (added 2026-09-10). Every number in this file traces to a repository
# artifact, a recorded run, a test command, or git/PR metadata, recorded in each bullet's
# `evidence` field. If you add a bullet with a number and cannot fill in `evidence`, the
# number is not defensible and does not belong here. Read `meta.source_of_truth_notes`
# before changing any figure — several stale numbers have already been corrected downward
# once, and it lists the ones that must never be reinstated.
#
# HOW TO UPDATE:
#   Add a new accomplishment under the right `experience`/`projects` entry with
#   the next free id (e.g. vns-09), fill text/metric/skills/tags/strength.
#   Bump meta.last_updated. Inline `# notes` are for you/the AI, never printed.
#
# FIELD GLOSSARY:
#   text     -> the canonical resume bullet, polished, ready to print
#   metric   -> the headline number in that bullet (for quick scanning/ranking)
#   skills   -> technologies/skills this bullet evidences
#   tags     -> which role archetypes this bullet should surface for
#   strength -> signature (must-include) | strong (include if room) | supporting (filler/depth)
#   variants -> OPTIONAL role-specific rephrasings. Same achievement, different emphasis.
#               If a variant exists for the role you're tailoring to, use it INSTEAD of `text`.
#   evidence -> OPTIONAL, NEVER PRINTED. Repo-relative path, command, or commit/PR that
#               reproduces the claim. Added 2026-09-10. Purely additive — downstream tooling
#               reads text/metric/skills/tags/strength and ignores unknown keys, so this is
#               safe. Rule: if a bullet carries a number, `evidence` must say where the
#               number comes from. If you cannot fill it in, the number is not defensible.
#
# TAILORING RECIPES:
#   The `tailoring_recipes` section (below role_targets) encodes, per role, the exact
#   bullet order, what to cut, and where projects go. If a recipe exists for your target
#   role, follow it; otherwise fall back to tags + strength selection.
# =============================================================================

